name: Windows build diagnostic
on: push
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf
        shell: pwsh
        run: |
          choco install protoc -y
          Remove-Item -Force bin/protoc, bin/protoc.exe -ErrorAction SilentlyContinue
          $protoc = (Get-Command protoc -ErrorAction Stop).Source
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$protoc"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: groky-x86_64-pc-windows-msvc
          cache-on-failure: true
      - name: Build groky
        shell: bash
        env:
          GROKY_VERSION: v0.1.22
        run: |
          version="${GROKY_VERSION#v}"
          export GROKY_VERSION="$version"
          cargo build -p xai-grok-pager-bin --locked --release --bin groky --target x86_64-pc-windows-msvc --features release-dist
      - name: Smoke executable
        shell: pwsh
        run: |
          & target/x86_64-pc-windows-msvc/release/groky.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: groky-windows-diagnostic
          path: target/x86_64-pc-windows-msvc/release/groky.exe
